name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/current/**"
      - "data/changes/**"
      - "data/history.json"

permissions:
  contents: read

jobs:
  test:
    # Pinned: the site tests need a Playwright-supported OS, and ubuntu-latest moves ahead of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Unit tests
        run: |
          python -m pytest pipeline/tests -q
          node --test tests/engine.test.mjs tests/status.test.mjs
      - name: House style
        run: python -m pipeline.style_lint
      - name: Data matches its published schema
        run: python -m pipeline.validate_data
      - name: Build the site
        run: python -m pipeline.build_site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Pages, accessibility and links
        run: node --test tests/site.test.cjs

  deploy:
    # Publishes code and guidance changes as soon as they reach main.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pipeline.build_site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub's artifact API sometimes does not list a just-uploaded artifact yet, and
      # deploy-pages then fails with "No artifacts named github-pages". One delayed retry
      # covers that; a second failure still fails the job.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
