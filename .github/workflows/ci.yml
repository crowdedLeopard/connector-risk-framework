name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/current/**"
      - "data/changes/**"
      - "data/history.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Unit tests
        run: |
          python -m pytest pipeline/tests -q
          node --test tests/engine.test.mjs tests/status.test.mjs
      - name: House style
        run: python -m pipeline.style_lint
      - name: Data matches its published schema
        run: python -m pipeline.validate_data
      - name: Build the site
        run: python -m pipeline.build_site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Pages, accessibility and links
        run: node --test tests/site.test.cjs

  deploy:
    # Publishes code and guidance changes as soon as they reach main.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pipeline.build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
