name: Dataverse sync

# Copies the weekly data into the Connector Risk Framework tables in Dataverse, so the Power Apps
# code app shows the same catalogue as the public site. See powerplatform/docs/DEPLOY.md.
#
# It does nothing until the repository has these settings (Settings > Secrets and variables > Actions):
#   variable DATAVERSE_URL      https://<org>.crm.dynamics.com
#   variable AZURE_TENANT_ID    the Microsoft Entra tenant ID
#   variable AZURE_CLIENT_ID    the app registration that is a Dataverse application user
#   secret   AZURE_CLIENT_SECRET  optional; without it the job signs in with a federated credential (OIDC)

on:
  workflow_run:
    workflows: ["Weekly refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "sync: new and changed connectors only. full: rewrite every row. provision: create or update tables, then a full sync."
        type: choice
        options: [sync, full, provision]
        default: sync

permissions:
  contents: read
  id-token: write # only used for the federated credential sign-in

concurrency:
  group: dataverse-sync
  cancel-in-progress: false

jobs:
  sync:
    # After a refresh, only when it succeeded. A manual run always proceeds.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dataverse
    env:
      DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATAVERSE_URL" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::notice title=Dataverse sync skipped::Set DATAVERSE_URL, AZURE_TENANT_ID and AZURE_CLIENT_ID to turn it on. See powerplatform/docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          # The refresh commits new data to main; sync what it committed.
          ref: main
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Provision tables
        if: steps.config.outputs.ready == 'true' && inputs.mode == 'provision'
        run: node powerplatform/sync/cli.mjs provision
      - name: Sync data
        if: steps.config.outputs.ready == 'true'
        run: node powerplatform/sync/cli.mjs sync ${{ (inputs.mode == 'full' || inputs.mode == 'provision') && '--full' || '' }}
