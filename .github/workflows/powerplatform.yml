name: Power Platform checks

# Tests the Dataverse sync and builds the code app whenever either changes.

on:
  pull_request:
    paths: ["powerplatform/**", "site/js/engine.js", ".github/workflows/powerplatform.yml"]
  push:
    branches: [main]
    paths: ["powerplatform/**", "site/js/engine.js", ".github/workflows/powerplatform.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: powerplatform/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: powerplatform/app/package-lock.json
      - name: Sync tests
        working-directory: .
        run: node --test powerplatform/tests/sync.test.mjs
      - name: Sync plan against the committed data
        working-directory: .
        run: node powerplatform/sync/cli.mjs plan
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Build the demo
        run: npm run build:demo
